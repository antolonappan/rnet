[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnet"
version = "0.1.0"
description = "Spherical map-level inference of the tensor-to-scalar ratio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "h5py", "pandas>=2.0"]

[project.optional-dependencies]
simulation = ["healpy>=1.16", "pixell", "pysm3", "pymaster", "astropy", "camb", "lenspyx", "tqdm"]
neural = ["tensorflow", "tensorflow-probability", "tf-keras", "deepsphere"]
sbi = ["torch", "sbi"]
paper = ["matplotlib>=3.8", "healpy>=1.16"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["rnet*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
rnet = []
